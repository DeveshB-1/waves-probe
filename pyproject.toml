[project]
name = "waves-probe"
version = "0.1.0"
description = "Customer-side latency and intelligibility probe for Smallest Waves TTS (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
waves-probe = "waves_probe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
